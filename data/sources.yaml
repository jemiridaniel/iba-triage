# Guideline sources for the retrieval index.
#
# PDFs go in data/raw/<file> (gitignored). `rag/ingest.py` only ingests documents listed
# here, so this file is also the licence register (CLAUDE.md rule 8).
# `scripts/fetch_sources.py` downloads every source with url_confirmed: true.
# `url` may be a direct PDF or a publication landing page (the fetcher then finds the PDF link).
# commit_text stays false unless the licence explicitly allows redistribution.
#
# Licences:
#   WHO  - CC BY-NC-SA 3.0 IGO: attribution required, non-commercial use, share-alike.
#   NCDC - Nigerian government publication; licence not stated. Use for retrieval and
#          citation only; do not commit or redistribute the text.

sources:
  - doc_id: nmep-malaria
    title: National Guidelines for the Diagnosis and Treatment of Malaria
    publisher: National Malaria Elimination Programme (NMEP), Federal Ministry of Health, Nigeria
    url: https://nmcp.gov.ng/  # no direct PDF published; add data/raw/nmep-malaria.pdf manually
    url_confirmed: false
    edition: "4th edition (2020)"
    file: nmep-malaria.pdf
    licence: unstated (government publication)
    licence_note: >-
      Official PDF not posted on the NMEP site. Obtain via the NMEP e-Toolkit (Case
      Management), info@nmep.gov.ng, or clinical contacts. Do not use third-party copies
      (e.g. Scribd) as a cited source. Do not commit.
    commit_text: false
    used_for: [uncomplicated and severe malaria criteria, treatment, weight-band dosing table]

  - doc_id: who-malaria
    title: WHO Guidelines for Malaria
    publisher: World Health Organization
    url: https://www.who.int/publications/i/item/guidelines-for-malaria
    url_confirmed: true
    edition: "Living guideline (current version at fetch time; record the version date from the PDF)"
    file: who-malaria.pdf
    licence: CC BY-NC-SA 3.0 IGO
    licence_note: >-
      CC BY-NC-SA 3.0 IGO. Attribution required ("WHO Guidelines for Malaria, World Health
      Organization"); non-commercial use only; adaptations under the same licence. Fine for
      the hackathon. Not committed; fetched at build time.
    commit_text: false
    used_for: [danger signs, severe malaria definitions, test-before-treat, interim dosing source]

  - doc_id: who-imci
