# Guideline sources for the retrieval index.
#
# PDFs go in data/raw/<file> (gitignored). `rag/ingest.py` only ingests documents listed
# here, so this file is also the licence register (CLAUDE.md rule 8).
#
# ALL URLs, editions and licence notes below are PLACEHOLDERS until confirmed by a human.
# Set url_confirmed: true only after opening the link and checking edition + licence.
# commit_text stays false unless the licence explicitly allows redistribution.

